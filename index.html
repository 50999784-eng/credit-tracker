<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英语学院学分统计系统</title>
  <link rel="stylesheet" href="style.css?v=20260908">
</head>
<body>
  <div id="gateOverlay" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="gate-card">
      <h1 id="gateTitle">英语学院学分统计系统</h1>
      <p class="gate-sub">请输入激活码后使用</p>
      <input type="text" id="gateInput" class="gate-input" placeholder="例如：CT-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" autocapitalize="characters">
      <button type="button" id="gateBtn" class="gate-btn">验证并进入</button>
      <p id="gateMsg" class="gate-msg" role="alert"></p>
      <p class="gate-hint">每个激活码限绑定一台设备，验证通过后本机将自动记住。如无法使用，请联系发放激活码的人。</p>
    </div>
  </div>
  <div id="wizard" class="panel-card">
    <h1>英语学院学分统计系统</h1>
    <p class="sub">2023 / 2024 / 2025 届 · 按你的培养方案统计</p>

    <section>
      <h2>1. 入学年份</h2>
      <div id="yearList" class="btn-row"></div>
    </section>

    <section id="channelSection" hidden>
      <h2>2. 你的培养通道</h2>
      <div id="channelList" class="btn-row"></div>
    </section>

    <section id="mainSection" hidden>
      <h2>3. 主修方向（英语大类）</h2>
      <div id="mainList" class="btn-row"></div>
    </section>

    <section id="doubleSection" hidden>
      <h2>3. 双学士学位项目</h2>
      <div id="doubleList" class="btn-row"></div>
    </section>

    <section id="secondSection" hidden>
      <h2>4. 是否修读第二专业</h2>
      <div id="secondTypeList" class="btn-row"></div>
      <div id="secondProgramList" class="btn-row"></div>
    </section>

    <p id="wizardMsg" class="msg"></p>
  </div>

  <div id="app" hidden>
    <header>
      <div>
        <h1>英语学院学分统计系统</h1>
        <p id="planLabel" class="plan-label"></p>
      </div>
      <div class="head-actions">
        <span id="saveHint" class="muted small"></span>
        <button id="changePlanBtn" class="btn">切换方案</button>
      </div>
    </header>

    <div class="searchbar">
      <input id="searchInput" class="search" placeholder="搜索课程名称 / 课程代码">
      <button id="openAllBtn" class="btn">展开全部</button>
      <button id="closeAllBtn" class="btn">折叠全部</button>
    </div>

    <section id="cards" class="cards"></section>

    <details id="summaryDetails" open>
      <summary>板块统计</summary>
      <table id="summaryTable" class="summary"></table>
    </details>

    <div id="courseArea"></div>
  </div>

  <script src="config.js?v=20260908"></script>
  <script src="gate.js?v=20260908"></script>
  <script src="plans.js?v=20260908"></script>
  <script src="data-v2.js?v=20260908"></script>
  <script src="app.js?v=20260908"></script>
</body>
</html>
